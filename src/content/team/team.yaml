# 현재 팀원 목록
# ACT Institute Team Members

# ===== 1세부 =====
- id: "division1-representative"
  name:
    ko: "오정권"
    en: "Oh, Jung-Kwon"
  position:
    ko: "Seoul National University, Professor"
    en: "Seoul National University, Professor"
  bio:
    ko: "오정권 교수는 서울대학교 임산공학과에서 학사 석사 박사를 마치고 서울대 산림과학부 환경재료과학전공에 교수로 재직중이다. 그는 공학목재, 목구조를 전공으로하고 있고, GLT, CLT 등 공학목재 뿐만아니라 NLT-콘크리트 복합재, 목재-강재 복합재에 대한 연구를 활발히 하고 있으며 탈현장건설을 위한 건축요소 개발에도 활발한 연구를 진행중이다. 본 연구과제에서는 초대형 GLT 및 cambered GLT, Curved GLT의 연구를 담당하고 있다."
    en: "Professor Jung-Kwon Oh earned his bachelor’s, master’s, and doctoral degrees in Forest Products at Seoul National University and currently teaches Environmental Materials Science in its Department of Forest Sciences. He specializes in engineered timber and timber structures, actively researching GLT and CLT, NLT–concrete composites, and timber–steel composites, as well as building components for off-site construction. In this project, he is responsible for research on extra-large GLT, cambered GLT, and curved GLT."
  image: "images/Oh, Jung-Kwon.png"
  scholar_url: "https://snutel.snu.ac.kr/"
  email: "jungoh@snu.ac.kr"
  affiliation:
    ko: ""
    en: ""
  division: 1
  is_representative: true

- id: "new-member"
  name:
    ko: "황경주"
    en: "Hwang, Kyung-Ju"
  position:
    ko: "University of Seoul, Professor"
    en: "University of Seoul, Professor"
  bio:
    ko: "황경주 교수는 독일 슈투트가르트대학(University of Stuttgart)에서 접합부 강성을 고려한 대공간 구조물의 구조디자인전공으로 공학박사를 취득하였으며 2012년부터 현재까지 독일 바덴 뷔르텐베르크(Baden Wurttenberg)주의 구조기술사로 등록되어 있다. 목재를 비롯한 다양한 재료를 활용한 고부가가치 건축구조물의 실현에 경험이 풍부하다. 경주 금관총 유물전시관의 국내 최장 경간의 목조 아치 지붕의 구조설계를 성공적으로 완성하여 2023년 한국공간구조학회 작품상을 수상하였다. "
    en: "Professor Kyung-Ju Hwang earned his Dr.-Ing. from the University of Stuttgart, Germany, specializing in structural design of large-span structures considering connection stiffness. He has been registered as a structural professional engineer in Baden-Württemberg since 2012. He has extensive experience in realizing high-value architectural structures using timber and other materials. He successfully designed the timber arch roof of the Geumgwanchong Relic Exhibition Hall in Gyeongju, the longest-span timber arch roof in Korea, and received the 2023 Works Award from the Korean Society of Space Structures."
  image: "images/Hwang, Kyung-Ju.png"
  scholar_url: "https://uosarch.ac.kr/"
  email: "kj.hwang@uos.ac.kr"
  affiliation:
    ko: ""
    en: ""
  division: 1
  is_representative: false

- id: "new-member"
  name:
    ko: "방성준"
    en: "Pang, Sung-Jun"
  position:
    ko: "Chonnam National University, Associate Professor"
    en: "Chonnam National University, Associate Professor"
  bio:
    ko: "본 연구과제는 한국형 신뢰성 기반 지압강도 DB 및 보정계수 개발을 주제로 하며, 국산 수종 및 파스너 조건을 반영한 목재 DB 구축과 보정계수 개발을 통해 목구조 대공간 설계를 지원하는 것을 목표로 합니다. 이를 통해 목조건축 및 국산 목재 활용 기술 고도화에 기여할 것으로 보이며, 연구 책임자는 목재역학 및 구조 분야의 풍부한 연구 경험을 바탕으로 해당 과제를 성공적으로 수행할 수 있을 것으로 기대됩니다."
    en: "This project develops a Korean reliability-based embedment strength database and adjustment factors. By establishing a timber database and adjustment factors that reflect domestic wood species and fastener conditions, it aims to support large-span timber structural design. The outcomes are expected to advance timber construction and technologies for using domestic timber. The principal investigator’s extensive research experience in timber mechanics and structures provides a strong foundation for successfully carrying out the project."
  image: "images/Pang, Sung-Jun.png"
  scholar_url: "https://sites.google.com/view/tctelab/%ED%99%88?authuser=1"
  email: "sjp@jnu.ac.kr"
  affiliation:
    ko: ""
    en: ""
  division: 1
  is_representative: false

- id: "new-member"
  name:
    ko: "이상준"
    en: "Lee, Sang-Joon"
  position:
    ko: "National Institute of Forest Science, Senior Research Scientist"
    en: "National Institute of Forest Science, Senior Research Scientist"
  bio:
    ko: "국립산림과학원 이상준 박사는 서울대학교에서 학사, 박사 학위를 취득하였으며 목구조 연구를 중심으로 임산공학을 전공하였다. 현재는 국립산림과학원 임업연구관으로서 국가 탄소중립 실현을 위한 건물부문 핵심 대안을 목조건축으로 보고, 국내 활성화를 위한 제도 개선, 산업 진흥, 국민인식 제고 등 정책 마련과 재료, 구조, 내화·차음·에너지 등 성능 확보를 위한 종합적 연구개발을 총괄하고 있다. "
    en: "Dr. Sang-Joon Lee of the National Institute of Forest Science earned his bachelor’s and doctoral degrees from Seoul National University, specializing in Forest Products with a focus on timber structures. As a Senior Research Scientist, he sees timber construction as a key building-sector solution for national carbon neutrality. He oversees policy development to improve regulations, promote industry, and raise public awareness of timber construction in Korea, alongside comprehensive R&D on materials, structures, fire resistance, sound insulation, and energy performance."
  image: "images/Lee, Sang-Joon.png"
  scholar_url: "http://nifos.forest.go.kr"
  email: "lsjoon@korea.kr"
  affiliation:
    ko: ""
    en: ""
  division: 1
  is_representative: false

- id: "new-member"
  name:
    ko: "안재홍"
    en: "An, Jae-Hong"
  position:
    ko: "KICT(Korea Institute of Civil engineering and building Technology), Ph.D, Senior Researcher"
    en: "KICT(Korea Institute of Civil engineering and building Technology), Ph.D, Senior Researcher"
  bio:
    ko: "안재홍은 건국대학교에서 건축물 내화구조로 박사학위를 받았으며, 한국건설기술연구원(KICT)에서 근무하면서 목조 건축물 내화구조 분야 기술 개발과 연구를 수행하고 있습니다. 목구조의 내화성능, 표준화, 고온 특성 해석 등 목조 건축물의 내화구조 및 화재 안전과 관련한 다양한 연구를 수행하였습니다. 연구 결과를 바탕으로 목구조 내화구조 기술의 실용성 확보와 표준화 적용 및 정책 지원에도 기여하고 있습니다."
    en: "Dr. Jae-Hong An earned his Ph.D. in fire-resistant building construction from Konkuk University. At the Korea Institute of Civil Engineering and Building Technology (KICT), he develops and researches fire-resistant technologies for timber buildings. His research covers timber structural fire resistance, standardization, analysis of high-temperature properties, and other aspects of fire-resistant construction and fire safety. His findings also support practical application, standardization, and policy development for fire-resistant timber structures."
  image: "images/An, Jae-Hong.png"
  scholar_url: "www.kict.re.kr"
  email: "rehong@kict.re.kr"
  affiliation:
    ko: ""
    en: ""
